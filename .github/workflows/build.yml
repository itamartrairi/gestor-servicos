name: Testes e APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: SQLite para os testes
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Gerar pastas das plataformas
        run: bash tool/preparar_plataformas.sh

      - run: flutter pub get

      - name: Análise estática
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testes do cenário (banco SQLite real)
        run: flutter test

      - name: Gerar APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: gestor-servicos-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    needs: android
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Gerar pastas das plataformas
        run: bash tool/preparar_plataformas.sh
      - run: flutter pub get
      - name: Compilar iOS (sem assinatura)
        run: flutter build ios --release --no-codesign
