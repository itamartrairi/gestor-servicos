name: IPA para iPhone antigo (iOS 12)

# Gera um .ipa SEM assinatura, compatível com iOS 12 (iPhone 5s, 6 e 6 Plus).
# Usa o Flutter 3.32, a última versão que ainda aceita o iOS 12.
# O arquivo deve ser assinado e instalado com o Sideloadly (Apple ID).

on:
  # Roda só quando este arquivo muda ou manualmente (Actions › Run workflow),
  # para poupar os minutos de Mac do plano.
  push:
    branches: [main]
    paths: ['.github/workflows/ios12.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Usar bibliotecas compatíveis com o Flutter 3.32
        run: |
          perl -pi -e 's/^  file_picker: .*/  file_picker: ^10.3.0/' pubspec.yaml
          cp tool/ios12/arquivos_legado.dart.txt lib/core/arquivos.dart
          grep -n file_picker pubspec.yaml

      - name: Gerar pastas das plataformas
        run: bash tool/preparar_plataformas.sh

      - name: Ajustar alvo mínimo para iOS 12
        run: |
          perl -pi -e 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/g' ios/Runner.xcodeproj/project.pbxproj
          if [ -f ios/Flutter/AppFrameworkInfo.plist ]; then
            perl -0pi -e 's#(<key>MinimumOSVersion</key>\s*<string>)[0-9.]+#${1}12.0#' ios/Flutter/AppFrameworkInfo.plist
          fi
          if [ -f ios/Podfile ]; then
            perl -pi -e "s/^#?\s*platform :ios.*/platform :ios, '12.0'/" ios/Podfile
            cat >> ios/Podfile <<'EOF'

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '12.0'
              end
            end
          end
          EOF
            # Remove o post_install original (fica só o nosso, no fim).
            python3 - <<'PY'
          import re
          p='ios/Podfile'; s=open(p).read()
          blocos=[m.start() for m in re.finditer(r'^post_install do', s, re.M)]
          if len(blocos)>1:
              ini=blocos[0]; fim=s.index('\nend\n', ini)+5
              s=s[:ini]+s[fim:]
          open(p,'w').write(s)
          PY
          fi
          grep -n "platform :ios\|12.0" ios/Podfile || true

      - run: flutter pub get

      - name: Compilar e arquivar iOS (sem assinatura)
        run: flutter build ipa --release --no-codesign

      - name: Montar .ipa a partir do arquivo do Xcode
        run: |
          APP=build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app
          test -d "$APP"
          echo "Versão mínima do iOS: $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")"
          echo "Arquiteturas: $(lipo -archs "$APP/Runner")"
          rm -rf saida && mkdir -p saida/Payload
          ditto "$APP" saida/Payload/Runner.app
          xattr -cr saida/Payload
          (cd saida && zip -qr -X ../GestorServicos-iOS12.ipa Payload)
          ls -lh GestorServicos-iOS12.ipa

      - name: Validar o .ipa
        run: |
          unzip -tq GestorServicos-iOS12.ipa
          unzip -l GestorServicos-iOS12.ipa | grep -E "Payload/Runner.app/(Runner|Info.plist)$"
          mkdir -p teste && unzip -q GestorServicos-iOS12.ipa -d teste
          file teste/Payload/Runner.app/Runner
          shasum -a 256 GestorServicos-iOS12.ipa | tee GestorServicos-iOS12.ipa.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: gestor-servicos-ipa-ios12
          path: GestorServicos-iOS12.ipa

      - name: Publicar o .ipa para download direto (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios12-${{ github.run_number }}"
          gh release create "$TAG" GestorServicos-iOS12.ipa GestorServicos-iOS12.ipa.sha256 \
            --title "iPhone (iOS 12) - versão ${{ github.run_number }}" \
            --notes "Arquivo .ipa sem assinatura para instalar com o Sideloadly. Veja o guia de instalação no iPhone." \
            --latest=false
