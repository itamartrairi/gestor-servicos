name: Versão web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar pastas das plataformas
        run: bash tool/preparar_plataformas.sh

      - name: SQLite para o navegador (WebAssembly)
        run: dart run sqflite_common_ffi_web:setup

      - name: Compilar versão web
        run: |
          flutter build web --release --base-href /${{ github.event.repository.name }}/
          touch build/web/.nojekyll
          ls -la build/web

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
      - id: deploy
        uses: actions/deploy-pages@v4
